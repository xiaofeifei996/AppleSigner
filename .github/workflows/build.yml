name: Build AppleSigner (Theos)

on:
  push:
    branches: [main]
    paths:
      - '**/*.m'
      - '**/*.h'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'AppleSigner-1.41.0-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Prepare source
        shell: bash
        run: |
          if [[ -f AppleSigner-1.41.0-source.zip ]]; then
            mkdir -p "$RUNNER_TEMP/applesigner-src"
            unzip -q AppleSigner-1.41.0-source.zip -d "$RUNNER_TEMP/applesigner-src"
            makefile="$(find "$RUNNER_TEMP/applesigner-src" -name Makefile -type f -print -quit)"
            test -n "$makefile"
            cp -R "$(dirname "$makefile")/." .
          fi
          test -f Makefile
          test -f control
          echo "Source files:"
          ls -la

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AppleSigner-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
