name: Build AppleSigner (RootHide Theos)

on:
  push:
    branches: [main, roothide]
    paths:
      - '**/*.m'
      - '**/*.h'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'roothide.entitlements'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        shell: bash
        run: |
          xcode-select -p
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -f "$HOME/theos/makefiles/common.mk"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify RootHide build configuration
        run: |
          grep -q 'THEOS_PACKAGE_SCHEME = roothide' Makefile
          grep -q 'Architecture: iphoneos-arm64e' control
          test -f roothide.entitlements

      - name: Build RootHide package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload RootHide Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AppleSigner-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
