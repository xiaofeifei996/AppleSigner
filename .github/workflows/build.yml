name: Build AppleSigner (RootHide Theos)

on:
  push:
    branches: [main, roothide, roothide-rewrite]
    paths:
      - '**/*.m'
      - '**/*.h'
      - 'SideSignCore/**'
      - 'SIDESIGN-INTEGRATION.md'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'scripts/**'
      - 'roothide.entitlements'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        shell: bash
        run: |
          xcode-select -p
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -f "$HOME/theos/makefiles/common.mk"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Validate SideSign Swift package for iOS
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          swift package --package-path SideSignCore resolve
          swift build --package-path SideSignCore --triple arm64-apple-ios15.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Verify RootHide build configuration
        run: |
          grep -q 'THEOS_PACKAGE_SCHEME = roothide' Makefile
          grep -q 'Architecture: iphoneos-arm64e' control
          test -f roothide.entitlements
          test -f scripts/fix-roothide-rpaths.py

      - name: Build RootHide package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Verify packaged Mach-O has no duplicate LC_RPATH
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          python3 - "$DEB" <<'PY'
          import collections, io, re, subprocess, sys, tarfile, tempfile
          from pathlib import Path

          deb = Path(sys.argv[1]).read_bytes()
          offset = 8
          data = None
          while offset + 60 <= len(deb):
              header = deb[offset:offset + 60]
              if header[58:60] != b"`\n":
                  raise SystemExit("Invalid Debian ar archive header")
              name = header[:16].decode("ascii").strip().rstrip("/")
              size = int(header[48:58].decode("ascii").strip())
              payload = deb[offset + 60:offset + 60 + size]
              if name.startswith("data.tar"):
                  data = payload
                  break
              offset += 60 + size + (size % 2)
          if data is None:
              raise SystemExit("No data.tar member found in Debian package")

          binary = None
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:*") as archive:
              for member in archive.getmembers():
                  if member.name.endswith("Applications/AppleSigner.app/AppleSigner"):
                      binary = archive.extractfile(member)
                      if binary:
                          break
              if binary is None:
                  raise SystemExit("AppleSigner executable not found in final deb")
              with tempfile.NamedTemporaryFile(prefix="AppleSigner-", delete=False) as output_file:
                  output_file.write(binary.read())
                  binary_path = output_file.name

          output = subprocess.check_output(["otool", "-l", binary_path], text=True)
          paths = []
          lines = output.splitlines()
          for i, line in enumerate(lines):
              if line.strip() == "cmd LC_RPATH":
                  for candidate in lines[i + 1:i + 5]:
                      match = re.match(r"\s*path (.+?) \(offset \d+\)", candidate)
                      if match:
                          paths.append(match.group(1))
                          break
          duplicates = [p for p, n in collections.Counter(paths).items() if n > 1]
          if duplicates:
              raise SystemExit("Duplicate LC_RPATH found in final deb: " + ", ".join(duplicates))
          print("Verified no duplicate LC_RPATH entries in packaged executable:")
          print("\n".join(paths) if paths else "(no LC_RPATH commands)")
          PY

      - name: Upload RootHide Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AppleSigner-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
